<!DOCTYPE html>
<html>
<head>
    <title>Agent Manager</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f9fafb; color: #333; }
        h1 { text-align: center; padding: 20px; margin: 0; background: linear-gradient(90deg, #4CAF50, #45a049); color: white; }
        .tab { display: flex; background-color: #fff; border-bottom: 1px solid #ddd; }
        .tab button { flex: 1; padding: 14px; background: none; border: none; font-size: 15px; cursor: pointer; }
        .tab button:hover { background: #f0f0f0; }
        .tab button.active { color: #4CAF50; font-weight: 600; border-bottom: 3px solid #4CAF50; background: #f9f9f9; }
        .tabcontent { display: none; max-width: 900px; margin: 20px auto; background: white; border-radius: 8px; padding: 20px; }
        input, textarea, select, button { width: 100%; padding: 10px 12px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; }
        button.save { background: #4CAF50; color: white; border: none; }
        button.save:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f9fafb; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; color: white; }
        .tag.yes { background: #4CAF50; }
        .tag.no { background: #999; }
        /* Lock Screen */
        #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(240,240,240,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        #lockBox { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); text-align: center; width: 300px; }
        #lockBox input { margin-top: 10px; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div id="lockBox">
        <h3>Enter Access Password</h3>
        <input type="password" id="pagePassword" placeholder="Password">
        <button onclick="checkPagePassword()">Enter</button>
    </div>
</div>

<h1>Agent Manager</h1>

<div class="tab">
    <button class="tablinks" id="tabAdd" onclick="openTab(event, 'Add')">Add Agent</button>
    <button class="tablinks active" id="tabUpdate" onclick="openTab(event, 'Update')">Update Agent</button>
</div>

<div id="Add" class="tabcontent">
    <h3>Add Agent</h3>
    <input type="text" id="add_name" placeholder="Agent Name">
    <textarea id="add_init" placeholder="Init Message"></textarea>
    <textarea id="add_prompt" placeholder="Prompt"></textarea>
    <input type="text" id="add_commit" placeholder="Commit Message">
    <button class="save" onclick="createAgent()">Create Agent</button>
    <div id="add_result"></div>
</div>

<div id="Update" class="tabcontent" style="display: block;">
    <h3>Update Agent</h3>
    <select id="agent_select" onchange="loadAgentDetails()">
        <option value="">-- Select Agent --</option>
    </select>
    <div id="update_form" style="display:none;">
        <h4>Head Version</h4>
        <textarea id="edit_init"></textarea>
        <textarea id="edit_prompt"></textarea>
        <button class="save" onclick="updateAgent()">Update Agent</button>
        <h4>Version History</h4>
        <table>
            <thead>
                <tr>
                    <th>Version ID</th>
                    <th>Timestamp</th>
                    <th>Commit Message</th>
                    <th>Head?</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="version_table"></tbody>
        </table>
    </div>
</div>

<script>
    let currentAgentKey = null;
    let addTabUnlocked = false;

    function checkPagePassword() {
        let pwd = document.getElementById("pagePassword").value;
        if (pwd === "1234") {
            document.getElementById("lockScreen").style.display = "none";
            loadAgentList(); // Default tab Update
        } else {
            alert("Wrong password!");
        }
    }

    function openTab(evt, tabName) {
        if (tabName === "Add" && !addTabUnlocked) {
            let pwd = prompt("Enter password to add agent:");
            if (pwd !== "qwer") {
                alert("Wrong password!");
                document.getElementById("tabUpdate").click();
                return;
            }
            addTabUnlocked = true;
        }
        let tabcontent = document.getElementsByClassName("tabcontent");
        for (let i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
        let tablinks = document.getElementsByClassName("tablinks");
        for (let i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.classList.add("active");
        if (tabName === "Update") loadAgentList();
    }

    async function createAgent() {
        let name = document.getElementById("add_name").value;
        let init = document.getElementById("add_init").value;
        let prompt = document.getElementById("add_prompt").value;
        let commit = document.getElementById("add_commit").value;
        if (!commit) { alert("Commit message required"); return; }
        let res = await fetch('/create_agent', {
            method: 'POST',
            body: new URLSearchParams({name, init_message: init, prompt, commit_message: commit})
        });
        let data = await res.json();
        document.getElementById("add_result").innerText = "Agent Created! Key: " + data.agent_key;
        document.getElementById("add_name").value = "";
        document.getElementById("add_init").value = "";
        document.getElementById("add_prompt").value = "";
        document.getElementById("add_commit").value = "";
    }

    async function loadAgentList() {
        let res = await fetch('/agents');
        let agents = await res.json();
        let select = document.getElementById("agent_select");
        select.innerHTML = '<option value="">-- Select Agent --</option>';
        agents.forEach(a => {
            let opt = document.createElement("option");
            opt.value = a.key;
            opt.textContent = a.name;
            select.appendChild(opt);
        });
    }

    async function loadAgentDetails() {
        let key = document.getElementById("agent_select").value;
        if (!key) {
            document.getElementById("update_form").style.display = "none";
            return;
        }
        currentAgentKey = key;
        let res = await fetch('/agent/' + key);
        let agent = await res.json();
        document.getElementById("edit_init").value = agent.init_message;
        document.getElementById("edit_prompt").value = agent.prompt;
        document.getElementById("update_form").style.display = "block";
        let historyRes = await fetch(`/agent/${key}/versions`);
        let versions = await historyRes.json();
        let tbody = document.getElementById("version_table");
        tbody.innerHTML = "";
        versions.forEach(v => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${v.version_id}</td>
                <td>${v.timestamp}</td>
                <td>${v.commit_message}</td>
                <td><span class="tag ${v.is_head ? 'yes' : 'no'}">${v.is_head ? 'Yes' : 'No'}</span></td>
                <td>${v.is_head ? `<button disabled>Current Head</button>` : `<button onclick="setHead(${v.version_id})">Set as Head</button>`}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function updateAgent() {
        let init = document.getElementById("edit_init").value;
        let promptText = document.getElementById("edit_prompt").value;
        let commit = prompt("Enter commit message for this update:");
        if (!commit) return;
        await fetch(`/agent/${currentAgentKey}/update`, {
            method: 'POST',
            body: new URLSearchParams({init_message: init, prompt: promptText, commit_message: commit})
        });
        alert("Agent updated successfully!");
        loadAgentDetails();
    }

    async function setHead(versionId) {
        await fetch(`/agent/${currentAgentKey}/set_head/${versionId}`, { method: 'POST' });
        alert("Head version updated!");
        loadAgentDetails();
    }
</script>

</body>
</html>
